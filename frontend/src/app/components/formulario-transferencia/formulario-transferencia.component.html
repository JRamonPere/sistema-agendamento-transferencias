<section class="card">
  <h2>Agendar Transferência</h2>

  <form (ngSubmit)="agendar()">
    <label>Conta de origem</label>
    <input
      type="text"
      name="contaOrigem"
      [(ngModel)]="transferencia.contaOrigem"
      maxlength="10"
      required
    />

    <label>Conta de destino</label>
    <input
      type="text"
      name="contaDestino"
      [(ngModel)]="transferencia.contaDestino"
      maxlength="10"
      required
    />

    <label>Valor da transferência</label>
    <input
      type="number"
      name="valorTransferencia"
      [(ngModel)]="transferencia.valorTransferencia"
      min="0.01"
      step="0.01"
      required
    />

    <label>Data da transferência</label>
    <input
      type="date"
      name="dataTransferencia"
      [(ngModel)]="transferencia.dataTransferencia"
      required
    />

    <button type="submit">Agendar</button>
  </form>

  <p class="sucesso" *ngIf="mensagemSucesso">{{ mensagemSucesso }}</p>
  <p class="erro" *ngIf="mensagemErro">{{ mensagemErro }}</p>
</section>
